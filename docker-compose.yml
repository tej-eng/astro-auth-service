services:
  astro-auth-service:
    build: .
    container_name: astro-auth-service
    restart: always

    env_file:
      - .env

    ports:
      - "8008:8008"

    volumes:
      # Shared uploads folder on host
      - /var/www/chat-uploads:/shared/chat-uploads

    networks:
      - dhwaniastro-net

    mem_limit: 50m
    memswap_limit: 50m

networks:
  dhwaniastro-net:
    external: true